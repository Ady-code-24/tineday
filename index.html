<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentine My Love ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
            overflow-x: hidden;
        }

        h1 {
            margin-top: 60px;
            font-size: 42px;
            animation: glowText 2s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 10px #fff; }
            to { text-shadow: 0 0 25px #ff66a3; }
        }

        .message {
            width: 80%;
            margin: 20px auto;
            background: rgba(255,255,255,0.2);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            font-size: 18px;
        }

        /* GLOW BUTTON */
        .valentine-btn {
            margin-top: 30px;
            padding: 18px 45px;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            background: #ff4d88;
            color: white;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 20px #ff99cc;
            animation: pulse 2s infinite;
        }

        .valentine-btn:hover {
            background: white;
            color: #ff4d88;
            box-shadow: 0 0 40px #ff66b2;
            transform: scale(1.08);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px #ff99cc; }
            50% { box-shadow: 0 0 35px #ff66b2; }
            100% { box-shadow: 0 0 15px #ff99cc; }
        }

        /* PHOTO CARDS */
        .photos {
            margin: 50px 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            width: 250px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: 0.4s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .card p {
            color: #ff4d88;
            padding: 15px;
            font-size: 16px;
        }

        /* Floating Hearts */
        .heart {
            position: fixed;
            bottom: -20px;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.5;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0.7; }
            100% { transform: translateY(-900px); opacity: 0; }
        }

        /* MOBILE RESPONSIVE */
        @media(max-width: 768px) {

            h1 {
                font-size: 28px;
            }

            .valentine-btn {
                font-size: 18px;
                padding: 15px 30px;
            }

            .card {
                width: 90%;
            }

            .card img {
                height: 220px;
            }
        }
    </style>
</head>

<body>

<h1>Happy Valentine's Day My Love 💗</h1>

<div class="message">
    You are my favorite person in the universe,and I am so grateful for you baby...muahhhhh..you mean so muchhh to me....🤍
</div>

<a href="love.html">
    <button class="valentine-btn">
        Be My Valentine 💗
    </button>
</a>

<!-- PHOTO CARDS -->
<div class="photos">

    <div class="card">
        <img src="mes2.png" alt="Memory 1">
        <p>muahhhh...ily bebe 💕(will give flowers irl soon too) </p>
    </div>

    <div class="card">
        <img src="mes.png" alt="Memory 2">
        <p>you my lovely man 💗</p>
    </div>

    <div class="card">
        <img src="mes3.png" alt="Memory 3">
        <p>Forever my favorite person and always willl be..❤️</p>
    </div>

</div>

<script>
    const colors = ["#ffb3d9", "#ffd6e8", "#ffcce6", "#ffe6f2", "#ff99cc"];

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        heart.style.color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.animationDuration = (Math.random() * 4 + 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }

    setInterval(createHeart, 300);
</script>

</body>
</html>
